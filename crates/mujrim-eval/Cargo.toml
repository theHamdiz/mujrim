[package]
name = "mujrim-eval"
version = "1.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
description = "Evaluation functions for the Mujrim engine"
license = "MIT"

[features]
default = ["nnue", "simd", "akimbo-nnue", "stockfish-nnue", "reckless-nnue", "viridithas-nnue", "obsidian-nnue", "plentychess-nnue"]
nnue = []
simd = []
akimbo-nnue = ["nnue"]
stockfish-nnue = ["nnue"]
reckless-nnue = ["nnue"]
viridithas-nnue = ["nnue", "dep:zstd", "stockfish-nnue"]
obsidian-nnue = ["nnue"]
plentychess-nnue = ["nnue", "stockfish-nnue"]
embedded-networks = ["nnue"]

[dependencies]
types = { package = "mujrim-types", path = "../mujrim-types" }
sha2 = "0.10"
zstd = { version = "0.13.3", optional = true }
