[package]
name = "mujrim-benchmarker"
version = "1.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
description = "Benchmark suite for Mujrim and external UCI/XBoard chess engines"
license = "MIT"

[lib]
name = "mujrim_benchmarker"
path = "src/lib.rs"

[[bin]]
name = "mujrim-benchmarker"
path = "src/main.rs"
required-features = ["internal"]

[features]
default = [
    "tui",
    "internal",
    "book",
    "nnue",
    "simd",
    "akimbo-nnue",
    "stockfish-nnue",
    "reckless-nnue",
    "viridithas-nnue",
    "obsidian-nnue",
    "plentychess-nnue",
    "ateed-nnue",
]
tui = ["dep:ratatui", "dep:crossterm"]
internal = ["dep:search", "dep:eval"]
book = ["search/book"]
nnue = ["eval/nnue", "search/nnue"]
simd = ["eval/simd", "search/simd"]
akimbo-nnue = ["eval/akimbo-nnue", "search/akimbo-nnue"]
stockfish-nnue = ["eval/stockfish-nnue", "search/stockfish-nnue"]
reckless-nnue = ["eval/reckless-nnue", "search/reckless-nnue"]
viridithas-nnue = ["eval/viridithas-nnue", "search/viridithas-nnue"]
obsidian-nnue = ["eval/obsidian-nnue", "search/obsidian-nnue"]
plentychess-nnue = ["eval/plentychess-nnue", "search/plentychess-nnue"]
ateed-nnue = ["eval/ateed-nnue", "search/ateed-nnue"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mujrim-bench-ratings = { path = "../mujrim-bench-ratings" }
serde_json = "1.0.149"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# Workspace crates
types = { package = "mujrim-types", path = "../mujrim-types" }
eval = { package = "mujrim-eval", path = "../mujrim-eval", default-features = false, optional = true }
search = { package = "mujrim-search", path = "../mujrim-search", default-features = false, optional = true }
mujrim-protocols = { path = "../mujrim-protocols" }
mujrim-study = { path = "../mujrim-study" }
