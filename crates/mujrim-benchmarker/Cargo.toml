[package]
name = "mujrim-benchmarker"
version = "2.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
description = "Benchmark suite for Mujrim and external UCI/XBoard chess engines"
license = "MIT"

[lib]
name = "mujrim_benchmarker"
path = "src/lib.rs"

[[bin]]
name = "mujrim-benchmarker"
path = "src/main.rs"

[features]
default = ["tui", "nnue", "simd", "akimbo-nnue"]
tui = ["dep:ratatui", "dep:crossterm"]
nnue = ["eval/nnue"]
simd = ["eval/simd"]
akimbo-nnue = ["eval/akimbo-nnue"]
stockfish-nnue = ["eval/stockfish-nnue"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mujrim-bench-ratings = { path = "../mujrim-bench-ratings" }
serde_json = "1.0.149"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# Workspace crates
types = { package = "mujrim-types", path = "../mujrim-types" }
eval = { package = "mujrim-eval", path = "../mujrim-eval" }
search = { package = "mujrim-search", path = "../mujrim-search" }
mujrim-protocols = { path = "../mujrim-protocols" }
mujrim-study = { path = "../mujrim-study" }
