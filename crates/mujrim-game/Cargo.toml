[package]
name = "mujrim-game"
version = "1.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
description = "Full-featured Bevy chess game for Mujrim"
license = "MIT"

[[bin]]
name = "mujrim-game"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.18", features = ["wav", "mp3"] }
types  = { package = "mujrim-types",  path = "../mujrim-types" }
search = { package = "mujrim-search", path = "../mujrim-search" }
eval   = { package = "mujrim-eval",   path = "../mujrim-eval" }
mujrim-protocols = { path = "../mujrim-protocols" }
rand = "0.9"
