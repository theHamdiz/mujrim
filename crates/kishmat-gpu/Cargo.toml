[package]
name = "kishmat-gpu"
version = "1.0.0"
edition = "2024"
description = "GPU/NPU auto-detection and compute backends for KishMat"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.31", optional = true }
objc2 = { version = "0.6", optional = true }

[features]
default = ["auto-detect"]
auto-detect = []
metal-backend = ["metal", "objc2"]
cuda-backend = []
