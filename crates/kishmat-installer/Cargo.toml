[package]
name = "kishmat-installer"
version = "1.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
description = "GUI installer for the KishMat chess engine suite"
license = "MIT"

[[bin]]
name = "kishmat-installer"
path = "src/main.rs"

[features]
default = []
embed = []

[dependencies]
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
iced_fonts = { version = "0.3", features = ["lucide"] }
updater = { package = "kishmat-updater", path = "../kishmat-updater" }
dirs = "6"
image = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
