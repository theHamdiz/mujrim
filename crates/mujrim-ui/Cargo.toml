[package]
name = "mujrim-ui"
version = "1.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
description = "Floem GUI for the Mujrim chess engine"
license = "MIT"

[features]
default = ["floem-ui", "book"]
book = []
floem-ui = []

[[bin]]
name = "mujrim-ui"
path = "src/main.rs"

[dependencies]
floem = { git = "https://github.com/lapce/floem", rev = "778bb5f2aa08429e579ee2e6ac97e84fbf18b618", features = ["tokio", "vger"] }
usvg = "0.46"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
types = { package = "mujrim-types", path = "../mujrim-types" }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.9"
arboard = "3.6.1"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
gif = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
updater = { package = "mujrim-updater", path = "../mujrim-updater" }
mujrim-protocols = { path = "../mujrim-protocols" }
mujrim-study = { path = "../mujrim-study" }
mujrim-benchmarker = { path = "../mujrim-benchmarker", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "0.9"

[dev-dependencies]
types = { package = "mujrim-types", path = "../mujrim-types" }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints.rust]
# objc 0.2 `msg_send!` expands `#[cfg(feature = "cargo-clippy")]` at call sites.
# Declare it so macOS `clippy -D warnings` does not fail on unexpected_cfgs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
