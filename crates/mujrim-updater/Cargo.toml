[package]
name = "mujrim-updater"
version = "1.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
description = "Updater and asset manager for the Mujrim chess engine"
license = "MIT"

[lib]
name = "mujrim_updater"
path = "src/lib.rs"

[[bin]]
name = "mujrim-updater"
path = "src/main.rs"

[dependencies]
# rustls keeps Linux cross/musl builds free of host OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = "4.6"
zip = "2"
tar = "0.4"
flate2 = "1"
indicatif = "0.17"
sha2 = "0.10"
dirs = "6"
toml = "0.8"
