[package]
name = "mujrim"
version = "1.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
categories = ["games", "game-engines"]
description = "The first Arabian chess engine written in Rust"
license = "MIT"
repository = "https://github.com/theHamdiz/mujrim"
readme = "README.md"

[workspace]
members = [
    "crates/mujrim-bench-ratings",
    "crates/mujrim-types",
    "crates/mujrim-eval",
    "crates/mujrim-native-v60",
    "crates/mujrim-search",
    "crates/mujrim-comms",
    "crates/mujrim-protocols",
    "crates/mujrim-tests",
    "crates/mujrim-ui",
    "crates/mujrim-updater",
    "crates/mujrim-gpu",
    "crates/mujrim-trainer",
    "crates/mujrim-benchmarker",
    "crates/mujrim-tooling",
    "crates/mujrim-installer",
    "crates/mujrim-study",
]

[features]
default = ["trainer", "gpu", "xboard", "book", "nnue", "simd", "akimbo-nnue", "stockfish-nnue", "reckless-nnue", "viridithas-nnue", "obsidian-nnue", "plentychess-nnue", "ateed-nnue", "syzygy"]
mimalloc = ["dep:mimalloc"]
trainer = ["dep:trainer"]
gpu = ["dep:gpu"]
xboard = ["comms/xboard"]
book = ["comms/book"]
nnue = ["comms/nnue"]
simd = ["eval/simd", "search/simd"]
akimbo-nnue = ["eval/akimbo-nnue", "search/akimbo-nnue"]
stockfish-nnue = ["eval/stockfish-nnue", "comms/stockfish-nnue", "search/stockfish-nnue"]
reckless-nnue = ["eval/reckless-nnue", "comms/reckless-nnue", "search/reckless-nnue"]
viridithas-nnue = ["eval/viridithas-nnue", "comms/viridithas-nnue", "search/viridithas-nnue"]
obsidian-nnue = ["eval/obsidian-nnue", "comms/obsidian-nnue", "search/obsidian-nnue"]
plentychess-nnue = ["eval/plentychess-nnue", "comms/plentychess-nnue", "search/plentychess-nnue"]
ateed-nnue = ["eval/ateed-nnue", "comms/ateed-nnue", "search/ateed-nnue"]
syzygy = ["search/syzygy", "comms/syzygy"]
embedded-networks = ["eval/embedded-networks", "search/embedded-networks"]

[dependencies]
clap = "4.6"
mujrim-bench-ratings = { path = "crates/mujrim-bench-ratings" }
mujrim-protocols = { path = "crates/mujrim-protocols" }
mimalloc = { version = "0.1.52", default-features = false, optional = true }

# Workspace crates — `package` rename lets source code keep short `use` names
types = { package = "mujrim-types", path = "crates/mujrim-types" }
comms = { package = "mujrim-comms", path = "crates/mujrim-comms", default-features = false }
search = { package = "mujrim-search", path = "crates/mujrim-search", default-features = false }
eval = { package = "mujrim-eval", path = "crates/mujrim-eval", default-features = false }
gpu = { package = "mujrim-gpu", path = "crates/mujrim-gpu", optional = true }
trainer = { package = "mujrim-trainer", path = "crates/mujrim-trainer", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

# Optimized tests without the multi-gigabyte fat-LTO test-harness link.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 8
strip = false

# Desktop binaries use thin LTO to retain cross-crate optimization while keeping
# linker memory below the workstation safety ceiling.
[profile.desktop-release]
inherits = "release"
lto = "thin"
codegen-units = 1

# Optimize dependencies in dev mode so GPU crates run at usable speed
[profile.dev.package."*"]
opt-level = 2
