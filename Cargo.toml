[package]
name = "kishmat"
version = "2.0.0"
edition = "2024"
authors = ["Ahmad Hamdi Emara"]
categories = ["games", "game-engines"]
description = "The first Arabian chess engine written in Rust"
license = "MIT"
repository = "https://github.com/theHamdiz/kishmat"
readme = "README.md"

[workspace]
members = [
    "crates/kishmat-types",
    "crates/kishmat-eval",
    "crates/kishmat-search",
    "crates/kishmat-comms",
    "crates/kishmat-tests",
    "crates/kishmat-ui",
    "crates/kishmat-updater",
    "crates/kishmat-gpu",
    "crates/kishmat-trainer",
]

[features]
default = ["mimalloc", "trainer", "gpu", "xboard", "book", "nnue", "simd", "akimbo-nnue", "stockfish-nnue"]
mimalloc = ["dep:mimalloc"]
trainer = ["dep:trainer"]
gpu = ["dep:gpu"]
xboard = ["comms/xboard"]
book = ["comms/book"]
nnue = ["comms/nnue"]
simd = ["eval/simd"]
akimbo-nnue = ["eval/akimbo-nnue"]
stockfish-nnue = ["eval/stockfish-nnue"]

[dependencies]
clap = "4.6"
mimalloc = { version = "0.1", default-features = false, optional = true }

# Workspace crates — `package` rename lets source code keep short `use` names
types = { package = "kishmat-types", path = "crates/kishmat-types" }
comms = { package = "kishmat-comms", path = "crates/kishmat-comms" }
search = { package = "kishmat-search", path = "crates/kishmat-search" }
eval = { package = "kishmat-eval", path = "crates/kishmat-eval" }
gpu = { package = "kishmat-gpu", path = "crates/kishmat-gpu", optional = true }
trainer = { package = "kishmat-trainer", path = "crates/kishmat-trainer", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
