name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "16777216"
  CARGO_BUILD_JOBS: "1"

jobs:
  # ── Quick checks (format, clippy, tests) on native runners ──
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS ARM64
          - os: windows-latest
            name: Windows x86_64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Build optimized artifacts
        run: |
          cargo build --release --workspace --exclude mujrim-ui --exclude mujrim-game --exclude mujrim-installer
          cargo build --release -p mujrim-ui
          cargo build --release -p mujrim-game

      - name: Prepare standalone fallback alias
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          suffix = ".exe" if os.name == "nt" else ""
          release = Path("target/release")
          shutil.copy2(
              release / f"mujrim-native-v60{suffix}",
              release / f"mujrim-v60{suffix}",
          )

      - name: Smoke test (UCI handshake)
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          exe = Path("target/release/mujrim")
          if os.name == "nt":
              exe = exe.with_suffix(".exe")
          if not exe.exists():
              print(f"missing engine executable: {exe}", file=sys.stderr)
              sys.exit(1)

          proc = subprocess.run(
              [str(exe), "uci"],
              input="uci\nquit\n",
              capture_output=True,
              text=True,
              timeout=15,
              check=False,
          )
          output = (proc.stdout or "") + (proc.stderr or "")
          if "uciok" not in output:
              print("uci smoke test failed, output:", file=sys.stderr)
              print(output, file=sys.stderr)
              sys.exit(1)

      - name: Test
        run: cargo test --profile release-test --workspace

  # ── Cross-compile check for ARM/MUSL targets ──
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    name: Cross-check ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Only build the CLI engine for cross targets (UI needs native GPU libs)
      - name: Cross build (engine only)
        run: cross build --release --target ${{ matrix.target }} -p mujrim
