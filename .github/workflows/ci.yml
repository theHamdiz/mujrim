name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "16777216"
  CARGO_BUILD_JOBS: "1"

jobs:
  # ── Quick checks (format, clippy, tests) on native runners ──
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: macos-latest
            name: macOS ARM64
          - os: windows-latest
            name: Windows x86_64
          - os: windows-11-arm
            name: Windows ARM64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/build deps (iced / EGL / ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libasound2-dev

      - name: Fetch Stockfish NNUE required for compile-time embed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/mujrim-eval/resources
          NET="crates/mujrim-eval/resources/nn-ab28990d4ea3.nnue"
          if [[ ! -f "$NET" ]]; then
            curl -fsSL --retry 5 --retry-delay 2 \
              -o "$NET" \
              "https://tests.stockfishchess.org/api/nn/nn-ab28990d4ea3.nnue"
          fi
          test -s "$NET"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Build optimized artifacts
        run: |
          cargo build --release --workspace --exclude mujrim-ui --exclude mujrim-game --exclude mujrim-installer
          cargo build --release -p mujrim-ui
          cargo build --release -p mujrim-game

      - name: Prepare standalone fallback alias
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          suffix = ".exe" if os.name == "nt" else ""
          release = Path("target/release")
          source = release / f"mujrim-v60{suffix}"
          if not source.exists():
              raise SystemExit(f"missing v60 adapter binary: {source}")
          # Keep an explicit arch-suffixed dist name for packaged layouts.
          import platform
          arch = platform.machine().lower().replace("amd64", "x86_64").replace("arm64", "aarch64")
          if os.name == "nt" and arch == "x86_64":
              arch = "x86_64-avx2"
          shutil.copy2(source, release / f"mujrim-v60-{arch}{suffix}")

      - name: Smoke test (UCI handshake)
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          exe = Path("target/release/mujrim")
          if os.name == "nt":
              exe = exe.with_suffix(".exe")
          if not exe.exists():
              print(f"missing engine executable: {exe}", file=sys.stderr)
              sys.exit(1)

          proc = subprocess.run(
              [str(exe), "uci"],
              input="uci\nquit\n",
              capture_output=True,
              text=True,
              timeout=15,
              check=False,
          )
          output = (proc.stdout or "") + (proc.stderr or "")
          if "uciok" not in output:
              print("uci smoke test failed, output:", file=sys.stderr)
              print(output, file=sys.stderr)
              sys.exit(1)
          if "Mujrim 1.0.0" not in output:
              print("uci smoke missing id name Mujrim 1.0.0:", file=sys.stderr)
              print(output, file=sys.stderr)
              sys.exit(1)

      - name: Test
        run: cargo test --profile release-test --workspace

  # ── Cross-compile check for ARM/MUSL engine + updater targets ──
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    name: Cross-check ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch Stockfish NNUE required for compile-time embed
        run: |
          set -euo pipefail
          mkdir -p crates/mujrim-eval/resources
          NET="crates/mujrim-eval/resources/nn-ab28990d4ea3.nnue"
          if [[ ! -f "$NET" ]]; then
            curl -fsSL --retry 5 --retry-delay 2 \
              -o "$NET" \
              "https://tests.stockfishchess.org/api/nn/nn-ab28990d4ea3.nnue"
          fi
          test -s "$NET"

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      # Engine + v60 + updater (rustls). UI needs native GPU libs.
      - name: Cross build (engine + updater)
        run: |
          cross build --release --target ${{ matrix.target }} -p mujrim
          cross build --release --target ${{ matrix.target }} -p mujrim-native-v60
          cross build --release --target ${{ matrix.target }} -p mujrim-updater

      - name: Smoke test via cross run (UCI handshake)
        run: |
          set -euo pipefail
          output="$(printf 'uci\nquit\n' | cross run --release --target ${{ matrix.target }} -p mujrim -- uci)"
          echo "$output"
          echo "$output" | grep -q 'uciok'
          echo "$output" | grep -q 'Mujrim 1.0.0'
